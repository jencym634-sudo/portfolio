name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. CONTINUOUS INTEGRATION (CI)
  # ==========================================
  ci:
    name: 🔍 Lint & Validate (CI)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐘 Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, pdo, json, session, mbstring
          coverage: none

      - name: 🔎 PHP Syntax Check (Lint all .php files)
        run: |
          echo "Scanning PHP files for syntax errors..."
          ERRORS=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file"; then
              echo "❌ Syntax error in $file"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find . -type f -name "*.php" -not -path "./.git/*" -print0)

          if [ $ERRORS -gt 0 ]; then
            echo "❌ CI Failed: Found $ERRORS PHP syntax error(s)."
            exit 1
          fi
          echo "✅ All PHP files passed syntax check!"

      - name: 📁 Validate Project Structure
        run: |
          echo "Verifying essential project files..."
          REQUIRED_FILES=(
            "index.php"
            "database.sql"
            "config/config.example.php"
            "includes/header.php"
            "includes/footer.php"
            "includes/functions.php"
            "admin/login.php"
            "admin/dashboard.php"
            "assets/css/style.css"
          )

          MISSING=0
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing required file: $file"
              MISSING=$((MISSING + 1))
            else
              echo "✅ Found: $file"
            fi
          done

          if [ $MISSING -gt 0 ]; then
            echo "❌ CI Failed: Missing $MISSING critical file(s)."
            exit 1
          fi
          echo "✅ Project structure is valid!"

      - name: 🛡️ Security & Secret Leak Check
        run: |
          echo "Scanning for accidental token or private key exposure..."
          if grep -rnEI 'ghp_[a-zA-Z0-9]{36}|-----BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY-----' --exclude-dir={.git,.github} .; then
            echo "❌ Potential secret or private key found in tracked files!"
            exit 1
          fi
          echo "✅ No sensitive tokens or keys detected."

  # ==========================================
  # 2. CONTINUOUS DEPLOYMENT (CD)
  # ==========================================
  deploy:
    name: 🚀 Deploy to InfinityFree (CD)
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐘 Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: 🔧 Generate production config
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          mkdir -p config
          cat > config/config.php << PHPEOF
          <?php
          /**
           * Database Configuration (Production)
           * Auto-generated by GitHub Actions CI/CD pipeline.
           */

          // Production error settings
          error_reporting(0);
          ini_set('display_errors', '0');
          ini_set('log_errors', '1');

          define('DB_HOST', '${DB_HOST}');
          define('DB_USER', '${DB_USER}');
          define('DB_PASS', '${DB_PASS}');
          define('DB_NAME', '${DB_NAME}');

          // Establish MySQL connection
          \$conn = mysqli_connect(DB_HOST, DB_USER, DB_PASS, DB_NAME);

          // Check connection
          if (!\$conn) {
              die('Database connection failed.');
          }

          // Set charset to UTF-8
          mysqli_set_charset(\$conn, 'utf8mb4');

          // Start session if not already started
          if (session_status() === PHP_SESSION_NONE) {
              session_start();
          }
          PHPEOF

      - name: 🧪 Validate generated config syntax
        run: |
          php -l config/config.php
          echo "✅ Production configuration is syntactically valid."

      - name: 📂 Ensure uploads directory exists
        run: mkdir -p uploads && touch uploads/.gitkeep

      - name: 🚀 Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            .gitignore
            database.sql
            README.md
            .github/**
            config/config.example.php
